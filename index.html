<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-96.png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <!-- interactive-widget: el teclado de Android redimensiona la página en vez de tapar el editor -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0D1117" />
    <title>WebWiz Quiz · Aprende programación haciendo el trabajo real</title>
    <meta name="description" content="Quizzes con medidor de confianza, 60 retos con tests en vivo, incidencias reales que depurar, revisiones de código de IA y laboratorios de SQL y Git. Gratis y en español." />
    <meta property="og:title" content="WebWiz Quiz · Entrena el trabajo de un dev" />
    <meta property="og:description" content="Quizzes, retos con tests, bugs reales y repaso espaciado. Gratis y en español." />
    <meta property="og:url" content="https://webwiz.orpira.es/" />
    <meta property="og:type" content="website" />
    <script>
      // Aplica el tema guardado antes de pintar para evitar parpadeo (oscuro por defecto)
      try {
        if (localStorage.getItem("webwiz-theme") === "light")
          document.documentElement.classList.remove("dark");
      } catch (e) {}
    </script>
  </head>


  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
